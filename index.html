<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GEPT 初級英檢寫作精進・外星微縮海圖 3D 互動群島 | Deep WebGL Audited Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">

  <!-- Three.js r160 ES Modules -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <style>
    :root {
      /* 海圖深海藍與四鄉五島膠囊同步色票 */
      --chart-navy: #0c335e;
      --chart-navy-dark: #061b36;
      --nangan-gold: #c57b30;
      --beigan-olive: #586e33;
      --dongyin-teal: #1c6472;
      --juguang-purple: #6c4f8f;
      --alien-cyan: #00f0ff;
      --alien-emerald: #10b981;
      --glass-panel: rgba(12, 35, 68, 0.88);
      --glass-border: rgba(147, 197, 253, 0.38);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #103c6e 0%, #092244 55%, #041022 100%);
      font-family: 'Noto Sans TC', 'Source Han Sans TW', 'PingFang TC', sans-serif;
      color: #f0f9ff;
    }

    #webgl-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 頂部海圖深海藍導航列 */
    header {
      position: absolute;
      top: 14px;
      left: 18px;
      right: 18px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }

    .brand-plaque {
      background: linear-gradient(135deg, rgba(12, 51, 94, 0.95), rgba(6, 27, 54, 0.92));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      border-left: 5px solid var(--nangan-gold);
      padding: 10px 20px;
      border-radius: 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      pointer-events: auto;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .brand-plaque:hover {
      transform: translateY(-2px);
    }

    .brand-title {
      font-size: 19px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title .badge-pill {
      font-size: 11px;
      background: var(--nangan-gold);
      color: #fff;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 800;
    }

    .brand-sub {
      font-size: 11.5px;
      color: #bae6fd;
      margin-top: 3px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* 四島膠囊色票同步導航 */
    .capsule-bar {
      display: flex;
      gap: 8px;
      pointer-events: auto;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .island-capsule {
      background: var(--capsule-bg, #0c335e);
      color: #ffffff;
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      padding: 8px 15px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      letter-spacing: 0.3px;
    }

    .island-capsule:hover {
      transform: translateY(-2px) scale(1.03);
      border-color: #ffffff;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.5);
    }

    .island-capsule.active {
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.25), 0 8px 24px rgba(0, 0, 0, 0.55);
      transform: translateY(-2px);
    }

    .capsule-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 6px #fff;
    }

    /* 3D 懸浮島嶼名牌 (CSS2DRenderer 精準綁定) */
    .diorama-label {
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(-18px);
      transition: transform 0.2s ease;
    }
    .diorama-label:hover {
      transform: translateY(-23px) scale(1.06);
    }
    .diorama-pill {
      background: var(--pill-bg, #0c335e);
      color: #fff;
      border: 1.5px solid rgba(255, 255, 255, 0.88);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 900;
      white-space: nowrap;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
      letter-spacing: 0.5px;
    }
    .diorama-sub-pill {
      margin-top: 2px;
      background: rgba(6, 27, 54, 0.9);
      color: #fde68a;
      border: 1px solid rgba(253, 230, 138, 0.45);
      padding: 1.5px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }
    .diorama-stem {
      width: 2px;
      height: 14px;
      background: linear-gradient(to bottom, #ffffff, transparent);
    }

    /* 右側英檢寫作診斷與地標戰情抽屜 */
    #writing-drawer {
      position: absolute;
      top: 84px;
      right: 18px;
      width: 400px;
      max-height: calc(100vh - 165px);
      background: var(--glass-panel);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid var(--glass-border);
      border-radius: 18px;
      padding: 18px 20px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.55);
      overflow-y: auto;
      transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }

    #writing-drawer.collapsed {
      transform: translateX(440px);
      opacity: 0;
      pointer-events: none;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      padding-bottom: 10px;
    }

    .sector-chip {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      background: var(--nangan-gold);
      margin-bottom: 5px;
    }

    .drawer-title {
      font-size: 18px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.3;
    }

    .drawer-landmark {
      font-size: 11.5px;
      color: #93c5fd;
      font-weight: 600;
      margin-top: 3px;
    }

    .drawer-close {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e2e8f0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .drawer-close:hover {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    .card-block {
      padding: 11px 13px;
      border-radius: 11px;
      font-size: 12.5px;
      line-height: 1.6;
    }

    .card-error {
      background: rgba(239, 68, 68, 0.15);
      border-left: 4px solid #f87171;
      color: #fee2e2;
    }
    .card-error strike {
      color: #fca5a5;
      margin: 0 2px;
    }

    .card-audit {
      background: rgba(245, 158, 11, 0.16);
      border-left: 4px solid #fbbf24;
      color: #fef3c7;
    }

    .card-solution {
      background: rgba(16, 185, 129, 0.16);
      border-left: 4px solid #34d399;
      color: #d1fae5;
    }

    .card-chant {
      background: rgba(14, 165, 233, 0.18);
      border: 1px dashed #38bdf8;
      color: #e0f2fe;
      font-weight: 700;
    }

    .block-label {
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #fff;
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 2px;
    }

    .btn-voice {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      border: none;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
      transition: transform 0.18s;
    }
    .btn-voice:hover { transform: translateY(-1px); }

    .btn-quiz {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      border: none;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
      transition: transform 0.18s;
    }
    .btn-quiz:hover { transform: translateY(-1px); }

    /* 互動改錯快篩練習區 */
    .quiz-box {
      background: rgba(6, 20, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 11px;
      padding: 11px 13px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    .quiz-box.active {
      display: flex;
    }
    .quiz-option {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f8fafc;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
    }
    .quiz-option:hover {
      background: rgba(56, 189, 248, 0.22);
      border-color: #38bdf8;
    }
    .quiz-option.correct {
      background: rgba(16, 185, 129, 0.35);
      border-color: #10b981;
      color: #a7f3d0;
    }
    .quiz-option.wrong {
      background: rgba(239, 68, 68, 0.35);
      border-color: #ef4444;
      color: #fecaca;
    }

    /* 底部多功能海圖波浪與巡航工具列 */
    footer {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(12, 51, 94, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      padding: 7px 16px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      white-space: nowrap;
    }

    .hud-tool {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e0f2fe;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .hud-tool:hover {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
    }
    .hud-tool.active {
      background: var(--nangan-gold);
      color: #fff;
      border-color: #fde68a;
      box-shadow: 0 0 14px rgba(197, 123, 48, 0.6);
    }

    /* RWD 手機與平板響應式最佳化 */
    @media (max-width: 860px) {
      header {
        top: 10px;
        left: 10px;
        right: 10px;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .brand-plaque {
        padding: 8px 14px;
      }
      .brand-title {
        font-size: 15.5px;
      }
      .brand-sub {
        font-size: 10.5px;
      }
      .capsule-bar {
        justify-content: flex-start;
        overflow-x: auto;
        flex-wrap: nowrap;
        padding-bottom: 4px;
        -webkit-overflow-scrolling: touch;
      }
      .island-capsule {
        padding: 6px 12px;
        font-size: 11.5px;
        flex-shrink: 0;
      }
      #writing-drawer {
        top: auto;
        bottom: 68px;
        left: 10px;
        right: 10px;
        width: auto;
        max-height: 46vh;
        padding: 14px;
      }
      #writing-drawer.collapsed {
        transform: translateY(120%);
      }
      footer {
        bottom: 10px;
        width: calc(100vw - 20px);
        justify-content: center;
        overflow-x: auto;
        padding: 6px 10px;
        gap: 5px;
      }
      .hud-tool {
        padding: 6px 10px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>

  <div id="webgl-container"></div>

  <!-- 頂部海圖深海藍 (#0c335e) 標題與四鄉膠囊色票導航列 -->
  <header>
    <div class="brand-plaque" onclick="window.resetOverview()">
      <div class="brand-title">
        <span>🪐 外星・四鄉五島英檢寫作精進群島</span>
        <span class="badge-pill">GEPT 初級複試</span>
      </div>
      <div class="brand-sub">128×96 頂點波浪海圖融合 × 四層次微縮實物模型 × 雙向 6 艘穿梭客輪</div>
    </div>

    <div class="capsule-bar">
      <button class="island-capsule active" style="--capsule-bg: #c57b30;" onclick="window.focusIsland(0)">
        <span class="capsule-dot"></span> 01 南竿・涅布拉時態島
      </button>
      <button class="island-capsule" style="--capsule-bg: #586e33;" onclick="window.focusIsland(1)">
        <span class="capsule-dot"></span> 02 北竿・芹壁排毒語塊島
      </button>
      <button class="island-capsule" style="--capsule-bg: #1c6472;" onclick="window.focusIsland(2)">
        <span class="capsule-dot"></span> 03 東引・雙島信標語音島
      </button>
      <button class="island-capsule" style="--capsule-bg: #6c4f8f;" onclick="window.focusIsland(3)">
        <span class="capsule-dot"></span> 04 莒光・東西雙島格位島
      </button>
    </div>
  </header>

  <!-- 右側英檢寫作精進診斷抽屜 -->
  <aside id="writing-drawer">
    <div class="drawer-header">
      <div>
        <span class="sector-chip" id="drawer-chip">01 南竿鄉・涅布拉時態要塞</span>
        <h2 class="drawer-title" id="drawer-title">過去式焦慮 ＆ 雙動詞衝突攻克區</h2>
        <div class="drawer-landmark" id="drawer-landmark">📍 微縮地標：媽祖原形泰坦巨神像、福澳碼頭、紅白雙吊臂與貨櫃場</div>
      </div>
      <button class="drawer-close" onclick="window.toggleDrawer(false)">✕</button>
    </div>

    <div class="card-block card-error">
      <div class="block-label">⚠️ 學生真實錯句樣本（Stella ＆ 手寫卷）</div>
      <div id="drawer-errors"></div>
    </div>

    <div class="card-block card-audit">
      <div class="block-label">🔍 資深教師批改盲點審計（Facts Check）</div>
      <div id="drawer-audit"></div>
    </div>

    <div class="card-block card-solution">
      <div class="block-label">🛡️ GEPT 初級滿分改變策略與替代語塊</div>
      <div id="drawer-solution"></div>
    </div>

    <div class="card-block card-chant">
      <div class="block-label">🔊 30 秒節奏拍手朗讀口訣（Phonological Loop）</div>
      <div id="drawer-chant"></div>
    </div>

    <div class="action-row">
      <button class="btn-voice" onclick="window.speakIslandGuidance()">
        <span>🔊</span> <span id="voice-btn-label">真人語音朗讀教學</span>
      </button>
      <button class="btn-quiz" onclick="window.toggleQuizBox()">
        <span>✍️</span> <span>隨堂改錯快篩挑戰</span>
      </button>
    </div>

    <div class="quiz-box" id="quiz-box">
      <div style="font-size:12px; font-weight:800; color:#bae6fd;" id="quiz-question"></div>
      <div id="quiz-options" style="display:flex; flex-direction:column; gap:6px;"></div>
      <div id="quiz-feedback" style="font-size:11.5px; font-weight:700; margin-top:2px;"></div>

  </aside>

  <!-- 底部工具列 -->
  <footer>
    <button class="hud-tool active" id="btn-wave-chart" onclick="window.cycleChartBlend()">
      🗺️ 海圖波浪：高融合 (100%)
    </button>
    <button class="hud-tool active" id="btn-ferry-toggle" onclick="window.toggleFerryFleet()">
      ⛴️ 雙向客輪艦隊 (6艘)
    </button>
    <button class="hud-tool" id="btn-orbit-tour" onclick="window.toggleAutoOrbit()">
      🛸 環島星海巡航
    </button>
    <button class="hud-tool" onclick="window.setTopChartView()">
      📐 海圖正俯視
    </button>
    <button class="hud-tool" onclick="window.resetOverview()">
      🎯 全景復位
    </button>
  </footer>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    /* =========================================================================
       1. 四鄉五島 × 初級英檢寫作精進完整知識庫
       ========================================================================= */
    const ARCHIPELAGO_DATA = [
      {
        id: 'nangan',
        name: '01 南竿鄉・涅布拉時態島',
        subLabel: '動詞守門員・to+V 原形照妖鏡',
        themeHex: '#c57b30',
        themeColor: 0xc57b30,
        pos: { x: -8, y: 0, z: 6 },
        camOffset: { x: -2, y: 20, z: 28 },
        lookAt: { x: -8, y: 2.2, z: 6 },
        title: '攻克：過去式過度類推 ＆ 雙動詞打架',
        landmark: '📍 微縮地標：新月三山體、媽祖原形巨神像（蓮花座/金光燈籠）、福澳碼頭雙吊臂與貨輪',
        errors: `
          • <code>went to the shop to <strike>bought a</strike> bread</code> (圖1)<br>
          • <code>He wanted to <strike>got</strike> a good grade.</code> (圖3)<br>
          • <code>brought his dog outside to <strike>played</strike></code> (圖4)<br>
          • <code>In the class, she <strike>felts</strike> very hungry.</code> (圖1)
        `,
        audit: `
          • <strong>原批改疏漏 1</strong>：圖 1 <code>In the class</code> 未改，「上課中」應為無冠詞 <strong><code>In class</code></strong>。<br>
          • <strong>原批改疏漏 2</strong>：圖 1 將 <code>her money were empty</code> 改為 <code>her pocket was empty</code> 雖通順，但教導 <strong><code>she ran out of money</code></strong> 更符合學生「錢花光」之原意。
        `,
        solution: `
          • <strong>「一山不容二虎」鐵律</strong>：一個子句只能有一個隨時間變化的動詞。<br>
          • <strong>「原形照妖鏡」</strong>：遇見 <strong><code>to / did / didn't / will / can</code></strong>，後方動詞一律打回原形：<br>
          👉 <code>went to <strong>buy some</strong> bread</code>（bread 為不可數名詞）<br>
          👉 <code>wanted to <strong>get</strong> a good grade</code>

    /* =========================================================================
       2. 座標空間與全域變數定義 (World Space: 120 × 90, Grid: 128 × 96)
       ========================================================================= */
    const OCEAN_W = 120;
    const OCEAN_H = 90;
    const GRID_X = 128;
    const GRID_Z = 96;

    let scene, camera, renderer, labelRenderer, controls;
    let oceanMesh, oceanGeo, oceanPosAttr;
    let chartTexture, plainOceanTexture;
    let chartBlendMode = 2; // 2: 100% 海圖波浪, 1: 50% 半透明海圖, 0: 純量子深海

    const clickableMeshes = [];
    const animatedLightBeams = [];
    const animatedGlowSpheres = [];
    const animatedFoamRings = [];
    const bidirectionalFerries = [];

    let currentIslandIdx = 0;
    let isFerryVisible = true;
    let isAutoOrbit = false;

    // 單一狀態機管理相機平滑飛行 (根除 setInterval 競態問題)
    const camFlight = {
      active: false,
      startTime: 0,
      duration: 1.15,
      startPos: new THREE.Vector3(),
      endPos: new THREE.Vector3(),
      startTarget: new THREE.Vector3(),
      endTarget: new THREE.Vector3()
    };

    /* 嚴格的世界座標 (wx, wz) 轉 海圖 Canvas 像素座標 (px, py) */
    function worldToCanvas(wx, wz, cw, ch) {
      // PlaneGeometry rotateX(-PI/2) 後：x ∈ [-W/2, W/2] -> u ∈ [0, 1]；z ∈ [-H/2, H/2] -> v ∈ [1, 0] -> py ∈ [0, ch]
      const px = ((wx / OCEAN_W) + 0.5) * cw;
      const py = ((wz / OCEAN_H) + 0.5) * ch;
      return { x: px, y: py };
    }

    /* 即時頂點波浪高度函數 (海圖網格與客輪共用同一數學模型，確保相位 100% 同步) */
    function getWaveHeightAt(x, z, time) {
      // 計算離最近島嶼中心的距離，岸邊波浪自動衰減避免穿模島嶼沙灘
      let shoreDamp = 1.0;
      const islandCenters = [
        { x: -8, z: 6, r: 12 },   // 南竿
        { x: 8, z: -8, r: 11 },   // 北竿
        { x: 2.2, z: -11.2, r: 3.5 }, // 龜島
        { x: 34, z: -24, r: 9 },  // 東引
        { x: 26, z: -24, r: 6 },  // 西引
        { x: -30, z: 23, r: 7.5 },// 西莒
        { x: -18, z: 25, r: 8 }   // 東莒
      ];
      for (const ic of islandCenters) {
        const d = Math.hypot(x - ic.x, z - ic.z);
        if (d < ic.r) {
          shoreDamp = Math.min(shoreDamp, Math.max(0.08, (d / ic.r) * 0.5));
        }
      }

      const w1 = Math.sin(x * 0.14 + time * 1.85) * Math.cos(z * 0.12 + time * 1.45) * 0.42;
      const w2 = Math.sin((x * 0.08 - z * 0.09) + time * 1.3) * 0.28;
      const w3 = Math.cos(x * 0.22 + z * 0.18 - time * 2.1) * 0.12;
      return (w1 + w2 + w3) * shoreDamp;
    }

    /* =========================================================================
       3. 初始化高階 WebGL 場景
       ========================================================================= */
    function initScene() {
      const container = document.getElementById('webgl-container');

      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x061b36, 0.0042);

      camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.5, 450);
      camera.position.set(0, 56, 74);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // CSS2D 懸浮標籤渲染器
      labelRenderer = new CSS2DRenderer();
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.domElement.style.position = 'absolute';
      labelRenderer.domElement.style.inset = '0';
      labelRenderer.domElement.style.pointerEvents = 'none';
      labelRenderer.domElement.style.zIndex = '10';
      container.appendChild(labelRenderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.maxPolarAngle = THREE.MathUtils.degToRad(76);
      controls.minPolarAngle = THREE.MathUtils.degToRad(12);
      controls.minDistance = 14;
      controls.maxDistance = 155;
      controls.target.set(0, 0, 2);

      setupLights();
      setupCosmicStarfield();

      // 核心亮點一：128x96 即時頂點波浪 × 海圖紋理融合
      setupVertexWaveMapOcean();

      // 核心亮點二：五島多層次微縮實物模型地形與地標
      buildMiniatureDioramaArchipelago();

      // 核心亮點三：雙向航行客輪系統 (6 艘對開立體客輪)
      buildBidirectionalFerryFleet();

      // 綁定互動事件
      window.addEventListener('resize', onWindowResize);
      renderer.domElement.addEventListener('pointerup', onPointerUpRaycasting);

      // 初始載入第 0 島資料面板
      updateDrawerUI(0);

      animate();
    }

    function setupLights() {
      const ambient = new THREE.AmbientLight(0xdbeafe, 1.15);
      scene.add(ambient);

      const hemi = new THREE.HemisphereLight(0x93c5fd, 0x0c335e, 1.1);
      scene.add(hemi);

      const dirLight = new THREE.DirectionalLight(0xfffbeb, 2.4);
      dirLight.position.set(45, 78, 42);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.camera.near = 10;
      dirLight.shadow.camera.far = 180;
      dirLight.shadow.camera.left = -62;
      dirLight.shadow.camera.right = 62;
      dirLight.shadow.camera.top = 52;
      dirLight.shadow.camera.bottom = -52;
      dirLight.shadow.bias = -0.0005;
      scene.add(dirLight);
    }

    function setupCosmicStarfield() {
      const count = 900;
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 320;
        positions[i + 1] = Math.random() * 95 + 14;
        positions[i + 2] = (Math.random() - 0.5) * 280;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({ color: 0xbae6fd, size: 0.65, transparent: true, opacity: 0.75 });
      scene.add(new THREE.Points(geo, mat));
    }

    /* =========================================================================
       4. 亮點一：即時海洋頂點波浪 × 海圖紋理融合 (setupVertexWaveMapOcean)
       ========================================================================= */
    function generateSeaChartCanvasTexture(includeChartGraphics = true) {
      const cw = 2048, ch = 1536;
      const cvs = document.createElement('canvas');
      cvs.width = cw;
      cvs.height = ch;
      const ctx = cvs.getContext('2d');

      // 1. 深海藍漸層底色 (#0c335e 為核心)
      const bgGrad = ctx.createRadialGradient(cw * 0.5, ch * 0.5, 80, cw * 0.5, ch * 0.5, cw * 0.52);
      bgGrad.addColorStop(0, '#164e87');
      bgGrad.addColorStop(0.55, '#0c335e');
      bgGrad.addColorStop(0.88, '#082242');
      bgGrad.addColorStop(1, '#041022');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, cw, ch);

      // 經緯網格線
      ctx.strokeStyle = 'rgba(147, 197, 253, 0.12)';
      ctx.lineWidth = 1.5;
      for (let x = 64; x < cw; x += 64) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ch); ctx.stroke();
      }
      for (let y = 64; y < ch; y += 64) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cw, y); ctx.stroke();
      }

      if (includeChartGraphics) {
        // 2. 海圖邊框與台灣海峽 / 東海星域圖騰
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.lineWidth = 4;
        ctx.strokeRect(48, 48, cw - 96, ch - 96);
        ctx.strokeStyle = 'rgba(197, 123, 48, 0.5)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(58, 58, cw - 116, ch - 116);

        // 左上角海圖主標題「馬祖・四鄉五島 × 初級英檢寫作星圖」
        ctx.fillStyle = 'rgba(12, 51, 94, 0.9)';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(96, 88, 660, 145, 18);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = '900 44px "Noto Sans TC", sans-serif';
        ctx.fillText('馬祖・四鄉五島 × 外星寫作海圖', 124, 152);
        ctx.fillStyle = '#fde68a';
        ctx.font = '700 23px "Noto Sans TC", sans-serif';
        ctx.fillText('GEPT ELEMENTARY WRITING ARCHIPELAGO CHART', 126, 198);

        // 右下角：精緻海圖羅盤與比例尺
        const compX = cw - 240, compY = ch - 230;
        ctx.save();
        ctx.translate(compX, compY);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.72)';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(0, 0, 74, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, 56, 0, Math.PI * 2); ctx.stroke();
        // 羅盤十字星芒
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath(); ctx.moveTo(0, -86); ctx.lineTo(14, 0); ctx.lineTo(0, -16); ctx.lineTo(-14, 0); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.beginPath(); ctx.moveTo(0, 86); ctx.lineTo(12, 0); ctx.lineTo(-12, 0); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-86, 0); ctx.lineTo(0, -12); ctx.lineTo(0, 12); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(86, 0); ctx.lineTo(0, -12); ctx.lineTo(0, 12); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 26px "Orbitron", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('N', 0, -96);
        ctx.restore();

        // 比例尺
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cw - 360, ch - 95);
        ctx.lineTo(cw - 120, ch - 95);
        ctx.moveTo(cw - 360, ch - 105);
        ctx.lineTo(cw - 360, ch - 85);
        ctx.moveTo(cw - 240, ch - 103);
        ctx.lineTo(cw - 240, ch - 87);
        ctx.moveTo(cw - 120, ch - 105);
        ctx.lineTo(cw - 120, ch - 85);
        ctx.stroke();
        ctx.fillStyle = '#e0f2fe';
        ctx.font = '700 20px "Noto Sans TC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('0          5          10 海里 (NM)', cw - 240, ch - 115);

        // 海域圖騰文字（東海 / 台灣海峽）
        ctx.fillStyle = 'rgba(186, 230, 253, 0.25)';
        ctx.font = '900 36px "Noto Sans TC", sans-serif';
        ctx.fillText('東 海 星 域  EAST CHINA SEA SECTOR', cw * 0.64, ch * 0.48);
        ctx.fillText('台 灣 海 峽 航 道  TAIWAN STRAIT', cw * 0.26, ch * 0.36);

        // 3. 繪製三條白色虛線主航道（與 3D 客輪航線座標 100% 同步）
        const drawRouteLine = (pts, labelText) => {
          ctx.save();
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.lineWidth = 4;
          ctx.setLineDash([16, 12]);
          ctx.beginPath();
          pts.forEach((pt, idx) => {
            const p = worldToCanvas(pt.x, pt.z, cw, ch);
            if (idx === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
          });
          ctx.stroke();
          ctx.restore();

          if (labelText && pts.length >= 2) {
            const midIdx = Math.floor(pts.length / 2);
            const pA = worldToCanvas(pts[midIdx - 1].x, pts[midIdx - 1].z, cw, ch);
            const pB = worldToCanvas(pts[midIdx].x, pts[midIdx].z, cw, ch);
            ctx.fillStyle = 'rgba(253, 230, 138, 0.92)';
            ctx.font = '700 20px "Noto Sans TC", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(labelText, (pA.x + pB.x) * 0.5 + 24, (pA.y + pB.y) * 0.5 - 12);
          }
        };

        // 航道 1: 北竿 ⇄ 東引
        drawRouteLine([{ x: 10, z: -9 }, { x: 22, z: -16 }, { x: 31, z: -22 }], '北竿 ⇄ 東引航線');
        // 航道 2: 北竿 ⇄ 南竿福澳 ⇄ 東莒
        drawRouteLine([{ x: 6, z: -6 }, { x: -4.5, z: 7.5 }, { x: -17, z: 24 }], '北竿 ⇄ 南竿福澳 ⇄ 東莒');
        // 航道 3: 南竿 ⇄ 西莒 / 東莒
        drawRouteLine([{ x: -7, z: 8.5 }, { x: -28, z: 22 }, { x: -19, z: 25 }], '南竿 ⇄ 西莒/東莒');

        // 4. 繪製各島海圖等深線光圈與不被 3D 模型遮擋的外引指標線文字
        const drawIslandCallout = (wx, wz, offsetPx, offsetPy, title, sub, hexColor) => {
          const center = worldToCanvas(wx, wz, cw, ch);
          const endX = center.x + offsetPx;
          const endY = center.y + offsetPy;

          // 島嶼周圍海圖等深虛線圈
          ctx.save();
          ctx.strokeStyle = 'rgba(186, 230, 253, 0.4)';
          ctx.lineWidth = 2;
          ctx.setLineDash([8, 6]);
          ctx.beginPath();
          ctx.arc(center.x, center.y, 115, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();

          // 外引指標折線
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(center.x + (offsetPx > 0 ? 75 : -75), center.y + (offsetPy > 0 ? 45 : -45));
          ctx.lineTo(endX, endY);
          ctx.lineTo(endX + (offsetPx > 0 ? 185 : -185), endY);
          ctx.stroke();

          // 膠囊色票底框
          const boxW = 240, boxH = 64;
          const boxX = offsetPx > 0 ? endX : endX - boxW;
          const boxY = endY - boxH - 6;
          ctx.fillStyle = hexColor;
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.roundRect(boxX, boxY, boxW, boxH, 14);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.font = '900 24px "Noto Sans TC", sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(title, boxX + boxW / 2, boxY + 29);
          ctx.fillStyle = '#fef08a';
          ctx.font = '700 16px "Noto Sans TC", sans-serif';
          ctx.fillText(sub, boxX + boxW / 2, boxY + 52);
        };

        drawIslandCallout(-8, 6, -210, -85, '南竿鄉 NANGAN', '動詞時態・媽祖福澳', '#c57b30');
        drawIslandCallout(8, -8, 175, 70, '北竿鄉 BEIGAN', '芹壁石屋・語塊排毒', '#586e33');
        drawIslandCallout(32, -24, -220, -65, '東引鄉 DONGYIN', '中柱連堤・燈塔語音', '#1c6472');
        drawIslandCallout(-30, 23, -155, -110, '西莒島 XIJU', '青帆港務・副詞黑洞', '#6c4f8f');
        drawIslandCallout(-18, 25, 165, 90, '東莒島・莒光鄉', '白犬燈塔・格位指代', '#6c4f8f');
      }

      const tex = new THREE.CanvasTexture(cvs);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    function setupVertexWaveMapOcean() {
      chartTexture = generateSeaChartCanvasTexture(true);
      plainOceanTexture = generateSeaChartCanvasTexture(false);

      // 邊緣羽化 Alpha 遮罩，使海圖無縫融入無邊際立體深海
      const alphaCvs = document.createElement('canvas');
      alphaCvs.width = 512; alphaCvs.height = 512;
      const aCtx = alphaCvs.getContext('2d');
      const aGrad = aCtx.createRadialGradient(256, 256, 120, 256, 256, 252);
      aGrad.addColorStop(0, '#ffffff');
      aGrad.addColorStop(0.82, '#ffffff');
      aGrad.addColorStop(1, '#000000');
      aCtx.fillStyle = aGrad;
      aCtx.fillRect(0, 0, 512, 512);
      const alphaTex = new THREE.CanvasTexture(alphaCvs);

      oceanGeo = new THREE.PlaneGeometry(OCEAN_W, OCEAN_H, GRID_X, GRID_Z);
      oceanGeo.rotateX(-Math.PI / 2);
      oceanPosAttr = oceanGeo.attributes.position;

      const oceanMat = new THREE.MeshStandardMaterial({
        map: chartTexture,
        alphaMap: alphaTex,
        transparent: true,
        opacity: 0.98,
        roughness: 0.24,
        metalness: 0.25
      });

      oceanMesh = new THREE.Mesh(oceanGeo, oceanMat);
      oceanMesh.receiveShadow = true;
      scene.add(oceanMesh);

      // 底層無邊際深海襯底平面
      const abyssGeo = new THREE.PlaneGeometry(420, 420);
      abyssGeo.rotateX(-Math.PI / 2);
      const abyssMat = new THREE.MeshBasicMaterial({ color: 0x041022 });
      const abyssMesh = new THREE.Mesh(abyssGeo, abyssMat);
      abyssMesh.position.y = -1.2;
      scene.add(abyssMesh);
    }

    /* =========================================================================
       5. 亮點二：五島多層次微縮實物模型地形與地標 (buildMiniatureDioramaArchipelago)
          每座島嶼皆採用「白色呼吸浪花裙邊 → 金黃沙灘岩岸 → 翠綠微縮草坡 → 森林山脊」四層次工法
       ========================================================================= */
    function createFourLayerIslandMound(rx, rz, height, islandIdx) {
      const moundGroup = new THREE.Group();

      // 第 1 層：白色呼吸浪花裙邊 (Breathing White Foam Skirt)
      const foamGeo = new THREE.RingGeometry(Math.min(rx, rz) * 0.88, Math.max(rx, rz) * 1.18, 36);
      foamGeo.rotateX(-Math.PI / 2);
      const foamMat = new THREE.MeshBasicMaterial({
        color: 0xe0f2fe,
        transparent: true,
        opacity: 0.58,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      const foamRing = new THREE.Mesh(foamGeo, foamMat);
      foamRing.scale.set(rx / Math.max(rx, rz), 1, rz / Math.max(rx, rz));
      foamRing.position.y = 0.08;
      moundGroup.add(foamRing);
      animatedFoamRings.push({ mesh: foamRing, baseScaleX: foamRing.scale.x, baseScaleZ: foamRing.scale.z, phase: Math.random() * 6 });

      // 第 2 層：金黃沙灘與花崗岩岸 (Golden Sand & Granite Coast)
      const sandGeo = new THREE.CylinderGeometry(0.88, 1.0, height * 0.28, 24);
      sandGeo.scale(rx, 1, rz);
      const sandMat = new THREE.MeshStandardMaterial({ color: 0xeab308, roughness: 0.85, metalness: 0.08, flatShading: true });
      const sandMesh = new THREE.Mesh(sandGeo, sandMat);
      sandMesh.position.y = height * 0.14;
      sandMesh.castShadow = true;
      sandMesh.receiveShadow = true;
      sandMesh.userData = { islandIdx };
      clickableMeshes.push(sandMesh);
      moundGroup.add(sandMesh);

      // 第 3 層：翠綠微縮草坡 (Lush Miniature Grass Slope)
      const grassGeo = new THREE.CylinderGeometry(0.65, 0.87, height * 0.36, 20);
      grassGeo.scale(rx, 1, rz);
      const grassMat = new THREE.MeshStandardMaterial({ color: 0x4d7c0f, roughness: 0.78, metalness: 0.05, flatShading: true });
      const grassMesh = new THREE.Mesh(grassGeo, grassMat);
      grassMesh.position.y = height * 0.28 + height * 0.18;
      grassMesh.castShadow = true;
      grassMesh.receiveShadow = true;
      grassMesh.userData = { islandIdx };
      clickableMeshes.push(grassMesh);
      moundGroup.add(grassMesh);

      // 第 4 層：森林山脊 (Deep Forest Mountain Ridge)
      const ridgeGeo = new THREE.ConeGeometry(0.64, height * 0.45, 16);
      ridgeGeo.scale(rx, 1, rz);
      const ridgeMat = new THREE.MeshStandardMaterial({ color: 0x166534, roughness: 0.82, flatShading: true });
      const ridgeMesh = new THREE.Mesh(ridgeGeo, ridgeMat);
      ridgeMesh.position.y = height * 0.64 + height * 0.225;
      ridgeMesh.castShadow = true;
      ridgeMesh.receiveShadow = true;
      ridgeMesh.userData = { islandIdx };
      clickableMeshes.push(ridgeMesh);
      moundGroup.add(ridgeMesh);

      return moundGroup;
    }

    /* 芹壁/大埔傳統花崗岩石屋（含朱紅起翹封火山牆＋屋頂防颱壓瓦石） */
    function createMatsuGraniteHouse(scale = 1.0) {
      const hGroup = new THREE.Group();
      const w = 1.1 * scale, h = 0.85 * scale, d = 0.9 * scale;

      // 花崗岩牆體
      const wall = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ color: 0xb8aba0, roughness: 0.92 })
      );
      wall.position.y = h / 2;
      wall.castShadow = true;
      hGroup.add(wall);

      // 朱紅起翹封火山牆 (兩側微翹山牆)
      const gableMat = new THREE.MeshStandardMaterial({ color: 0xc83e2b, roughness: 0.65 });
      const gableGeo = new THREE.BoxGeometry(0.1 * scale, h * 0.65, d * 1.06);
      const leftGable = new THREE.Mesh(gableGeo, gableMat);
      leftGable.position.set(-w / 2 - 0.02, h * 0.92, 0);
      leftGable.rotation.z = 0.16;
      const rightGable = new THREE.Mesh(gableGeo, gableMat);
      rightGable.position.set(w / 2 + 0.02, h * 0.92, 0);
      rightGable.rotation.z = -0.16;
      hGroup.add(leftGable, rightGable);

      // 雙坡紅瓦屋頂
      const roof = new THREE.Mesh(
        new THREE.ConeGeometry(w * 0.76, 0.42 * scale, 4),
        new THREE.MeshStandardMaterial({ color: 0x9a3412, roughness: 0.78 })
      );
      roof.rotation.y = Math.PI / 4;
      roof.position.y = h + 0.21 * scale;
      hGroup.add(roof);

      // 屋頂防颱壓瓦石 (4 顆白色/灰色花崗岩塊)
      const stoneMat = new THREE.MeshStandardMaterial({ color: 0xe5e7eb, roughness: 0.9 });
      for (let i = 0; i < 4; i++) {
        const stone = new THREE.Mesh(new THREE.DodecahedronGeometry(0.08 * scale), stoneMat);
        stone.position.set((i % 2 === 0 ? -0.22 : 0.22) * scale, h + 0.28 * scale, (i < 2 ? -0.18 : 0.18) * scale);
        hGroup.add(stone);
      }
      return hGroup;
    }

    /* 掛載 CSS2D 懸浮島嶼名牌 */
    function attachIslandHUDLabel(parentGroup, title, subText, pillColorHex, yHeight, islandIdx) {
      const div = document.createElement('div');
      div.className = 'diorama-label';
      div.style.setProperty('--pill-bg', pillColorHex);
      div.innerHTML = `
        <div class="diorama-pill">${title}</div>
        <div class="diorama-sub-pill">${subText}</div>
        <div class="diorama-stem"></div>
      `;
      div.onclick = (e) => {
        e.stopPropagation();
        window.focusIsland(islandIdx);
      };
      const labelObj = new CSS2DObject(div);
      labelObj.position.set(0, yHeight, 0);
      parentGroup.add(labelObj);
    }

    function buildMiniatureDioramaArchipelago() {
      // =========================================================================
      // 【01 南竿島】：新月形三山體、西側山巔媽祖巨神像、中央福澳灣碼頭/吊臂/貨櫃/貨輪
      // =========================================================================
      const nanganGroup = new THREE.Group();
      nanganGroup.position.set(-8, 0, 6);

      // 新月形三山體微縮地形 (西山峰、中央灣、東山峰)
      const ngWestMound = createFourLayerIslandMound(5.2, 4.6, 5.2, 0);
      ngWestMound.position.set(-3.8, 0, -0.5);
      const ngCenterMound = createFourLayerIslandMound(5.8, 4.2, 3.6, 0);
      ngCenterMound.position.set(0, 0, 1.2);
      const ngEastMound = createFourLayerIslandMound(4.8, 4.5, 4.8, 0);
      ngEastMound.position.set(4.0, 0, -0.6);
      nanganGroup.add(ngWestMound, ngCenterMound, ngEastMound);

      // 西側山巔：媽祖原形泰坦巨神像（石階、粉紅蓮花座、金冠、高亮度呼吸金光燈籠與光暈球）
      const mazuGroup = new THREE.Group();
      mazuGroup.position.set(-3.8, 4.6, -0.5);

      // 參道石階
      const stairMesh = new THREE.Mesh(
        new THREE.BoxGeometry(0.9, 0.6, 2.2),
        new THREE.MeshStandardMaterial({ color: 0xd6d3d1, roughness: 0.85 })
      );
      stairMesh.position.set(0, -0.2, 1.1);
      stairMesh.rotation.x = 0.35;
      mazuGroup.add(stairMesh);

      // 粉紅蓮花座
      const lotusMesh = new THREE.Mesh(
        new THREE.CylinderGeometry(1.15, 0.85, 0.55, 16),
        new THREE.MeshStandardMaterial({ color: 0xf472b6, roughness: 0.4, metalness: 0.2 })
      );
      lotusMesh.position.y = 0.25;
      mazuGroup.add(lotusMesh);

      // 純白神像法相軀幹
      const statueBody = new THREE.Mesh(
        new THREE.CylinderGeometry(0.45, 0.72, 2.5, 16),
        new THREE.MeshStandardMaterial({ color: 0xfffbeb, roughness: 0.35, metalness: 0.15 })
      );
      statueBody.position.y = 1.65;
      statueBody.castShadow = true;
      mazuGroup.add(statueBody);

      // 媽祖金冠
      const crown = new THREE.Mesh(
        new THREE.CylinderGeometry(0.38, 0.32, 0.55, 12),
        new THREE.MeshStandardMaterial({ color: 0xfbbf24, metalness: 0.85, roughness: 0.15 })
      );
      crown.position.y = 3.1;
      mazuGroup.add(crown);

      // 手持高亮度呼吸金光燈籠與光暈球
      const lanternCore = new THREE.Mesh(
        new THREE.SphereGeometry(0.34, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xfffbeb })
      );
      lanternCore.position.set(0.85, 2.1, 0.55);
      mazuGroup.add(lanternCore);

      const lanternHalo = new THREE.Mesh(
        new THREE.SphereGeometry(0.75, 16, 16),
        new THREE.MeshBasicMaterial({
          color: 0xf59e0b,
          transparent: true,
          opacity: 0.45,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        })
      );
      lanternHalo.position.copy(lanternCore.position);
      mazuGroup.add(lanternHalo);
      animatedGlowSpheres.push(lanternHalo);

      nanganGroup.add(mazuGroup);

      // 中央福澳灣：福澳碼頭、港務倉儲大樓、紅白雙座裝卸吊臂、彩色微縮貨櫃場與靠泊貨輪
      const fuaoPort = new THREE.Group();
      fuaoPort.position.set(1.2, 0.45, 3.8);

      // 混凝土碼頭平台
      const pierSlab = new THREE.Mesh(
        new THREE.BoxGeometry(5.6, 0.45, 2.6),
        new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.75 })
      );
      fuaoPort.add(pierSlab);

      // 港務倉儲大樓
      const portBuilding = new THREE.Mesh(
        new THREE.BoxGeometry(1.7, 1.1, 1.1),
        new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.5 })
      );
      portBuilding.position.set(-1.6, 0.75, -0.4);
      const portRoof = new THREE.Mesh(
        new THREE.BoxGeometry(1.8, 0.18, 1.2),
        new THREE.MeshStandardMaterial({ color: 0x0284c7 })
      );
      portRoof.position.set(-1.6, 1.38, -0.4);
      fuaoPort.add(portBuilding, portRoof);

      // 紅白雙座裝卸吊臂
      for (let c = 0; c < 2; c++) {
        const crane = new THREE.Group();
        crane.position.set(0.3 + c * 1.4, 0.22, 0.6);
        const legMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.4 });
        const boomMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
        const tower = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1.8, 0.22), legMat);
        tower.position.y = 0.9;
        const boom = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 1.9), boomMat);
        boom.position.set(0, 1.75, 0.55);
        boom.rotation.x = -0.2;
        crane.add(tower, boom);
        fuaoPort.add(crane);
      }

      // 彩色微縮貨櫃場
      const containerColors = [0xf59e0b, 0xef4444, 0x10b981, 0x3b82f6];
      for (let i = 0; i < 6; i++) {
        const cMesh = new THREE.Mesh(
          new THREE.BoxGeometry(0.65, 0.38, 0.38),
          new THREE.MeshStandardMaterial({ color: containerColors[i % 4], roughness: 0.5 })
        );
        cMesh.position.set(0.2 + (i % 3) * 0.72, 0.42 + Math.floor(i / 3) * 0.4, -0.35);
        fuaoPort.add(cMesh);
      }

      // 靠泊貨輪
      const berthedShip = new THREE.Group();
      berthedShip.position.set(1.1, -0.1, 2.0);
      const bHull = new THREE.Mesh(
        new THREE.BoxGeometry(2.4, 0.45, 0.82),
        new THREE.MeshStandardMaterial({ color: 0x1e3a8a })
      );
      const bBridge = new THREE.Mesh(
        new THREE.BoxGeometry(0.55, 0.5, 0.68),
        new THREE.MeshStandardMaterial({ color: 0xffffff })
      );
      bBridge.position.set(-0.7, 0.45, 0);
      berthedShip.add(bHull, bBridge);
      fuaoPort.add(berthedShip);

      nanganGroup.add(fuaoPort);
      attachIslandHUDLabel(nanganGroup, '01 南竿島・涅布拉時態要塞', '媽祖巨神像 × 福澳港・to+V 原形照妖鏡', '#c57b30', 9.2, 0);
      scene.add(nanganGroup);

      // =========================================================================
      // 【02 北竿島】：東北—西南狹長島體、4棟芹壁封火山牆石屋、立體芹壁龜島、高登/大坵/亮島礁
      // =========================================================================
      const beiganGroup = new THREE.Group();
      beiganGroup.position.set(8, 0, -8);

      const bgMainMound = createFourLayerIslandMound(8.2, 4.2, 5.6, 1);
      bgMainMound.rotation.y = Math.PI / 5; // 東北—西南走向
      beiganGroup.add(bgMainMound);

      // 山坡層疊 4 棟芹壁傳統花崗岩石屋
      const houseOffsets = [
        { x: -2.2, y: 2.1, z: -1.1 },
        { x: -0.6, y: 2.6, z: -1.4 },
        { x: 1.1, y: 2.3, z: -0.9 },
        { x: -1.4, y: 3.3, z: -0.2 }
      ];
      houseOffsets.forEach(pos => {
        const house = createMatsuGraniteHouse(0.92);
        house.position.set(pos.x, pos.y, pos.z);
        house.rotation.y = -0.35;
        beiganGroup.add(house);
      });

    /* =========================================================================
       6. 亮點三：雙向航行客輪系統 (buildBidirectionalFerryFleet)
          3 條主航道 × 雙向對開共 6 艘立體客輪 (右舷 laneOffset + 乘浪起伏)

    function createFerryVesselMesh(bridgeColorHex) {

      bowCone.position.set(0, 0.22, 1.55);
      hullShape.add(mainHull, bowCone);

      const deckCabin = new THREE.Mesh(

      );

      // 彩色駕駛台與煙囪
      const wheelhouse = new THREE.Mesh(

        new THREE.MeshStandardMaterial({ color: bridgeColorHex, roughness: 0.3 })
      );
      wheelhouse.position.set(0, 0.96, 0.32);
      vessel.add(wheelhouse);

      // 船尾白色浪花尾跡 (Wake Trail)
      const wakeGeo = new THREE.PlaneGeometry(0.85, 2.6);
      wakeGeo.rotateX(-Math.PI / 2);
      const wakeMat = new THREE.MeshBasicMaterial({
        color: 0xe0f2fe,
        transparent: true,
        opacity: 0.55,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      const wakeMesh = new THREE.Mesh(wakeGeo, wakeMat);
      wakeMesh.position.set(0, 0.05, -2.25);
      vessel.add(wakeMesh);

      return vessel;
    }

    function buildBidirectionalFerryFleet() {
      const routeSpecs = [
        {
          name: '北竿 ⇄ 東引',
          color: 0x1c6472,
          points: [
            new THREE.Vector3(10, 0, -9),
            new THREE.Vector3(21, 0, -16),
            new THREE.Vector3(30, 0, -21.5)
          ]
        },
        {
          name: '北竿 ⇄ 南竿福澳 ⇄ 東莒',
          color: 0xc57b30,
          points: [
            new THREE.Vector3(6, 0, -5.5),
            new THREE.Vector3(-4.2, 0, 7.8),
            new THREE.Vector3(-16.5, 0, 23.2)
          ]
        },
        {
          name: '南竿 ⇄ 西莒/東莒',
          color: 0x6c4f8f,
          points: [
            new THREE.Vector3(-7.2, 0, 8.8),
            new THREE.Vector3(-27.2, 0, 21.2),
            new THREE.Vector3(-19.2, 0, 24.5)
          ]
        }
      ];

      routeSpecs.forEach((spec, idx) => {
        const curve = new THREE.CatmullRomCurve3(spec.points);

        // 去程客輪 (dir = +1) 與 返程客輪 (dir = -1)
        [1, -1].forEach((dir, dIdx) => {
          const shipMesh = createFerryVesselMesh(spec.color);
          scene.add(shipMesh);

          bidirectionalFerries.push({
            mesh: shipMesh,
            curve,
            dir,
            t: (idx * 0.28 + dIdx * 0.48) % 1.0,
            speed: 0.052 + idx * 0.006,
            laneOffset: 1.15 // 右舷偏移量，確保雙向交會平順不碰撞
          });
        });
      });
    }

    /* =========================================================================
       7. 動畫主迴圈 (頂點波浪、雙向客輪俯仰乘浪、360度探照光束、平滑運鏡)
       ========================================================================= */
    const clock = new THREE.Clock();
    const tmpPt = new THREE.Vector3();
    const tmpTan = new THREE.Vector3();
    const tmpRight = new THREE.Vector3();
    const upAxis = new THREE.Vector3(0, 1, 0);

    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();
      const dt = Math.min(clock.getDelta(), 0.05);

      // 1. 更新 128×96 海圖頂點波浪
      if (oceanPosAttr) {
        for (let i = 0; i < oceanPosAttr.count; i++) {
          const vx = oceanPosAttr.getX(i);
          const vz = oceanPosAttr.getZ(i);
          oceanPosAttr.setY(i, getWaveHeightAt(vx, vz, elapsed));
        }
        oceanPosAttr.needsUpdate = true;
        oceanGeo.computeVertexNormals();
      }

      // 2. 島嶼岸邊白色呼吸浪花裙邊動畫
      animatedFoamRings.forEach(item => {
        const pulse = 1.0 + Math.sin(elapsed * 2.4 + item.phase) * 0.045;
        item.mesh.scale.set(item.baseScaleX * pulse, 1, item.baseScaleZ * pulse);
        item.mesh.material.opacity = 0.45 + Math.sin(elapsed * 2.4 + item.phase) * 0.18;
      });

      // 3. 媽祖金光燈籠與白犬燈塔光暈呼吸
      animatedGlowSpheres.forEach((halo, idx) => {
        const s = 1.0 + Math.sin(elapsed * 3.2 + idx) * 0.18;
        halo.scale.set(s, s, s);
      });

      // 4. 東引燈塔與東莒白犬燈塔 360 度燈芯公轉光束
      animatedLightBeams.forEach(item => {
        item.pivot.rotation.y += item.speed;
      });

      // 5. 6 艘雙向客輪右舷偏移與真實乘浪起伏
      if (isFerryVisible) {
        bidirectionalFerries.forEach((ferry, fIdx) => {
          ferry.t += (ferry.speed * 0.0022) * ferry.dir;
          if (ferry.t > 1) ferry.t -= 1;
          if (ferry.t < 0) ferry.t += 1;

          ferry.curve.getPointAt(ferry.t, tmpPt);
          ferry.curve.getTangentAt(ferry.t, tmpTan);
          if (ferry.dir < 0) tmpTan.negate(); // 返程切線反轉

          // 右舷法向量：tangent × upAxis
          tmpRight.crossVectors(tmpTan, upAxis).normalize();

          const shipX = tmpPt.x + tmpRight.x * ferry.laneOffset;
          const shipZ = tmpPt.z + tmpRight.z * ferry.laneOffset;
          const waveY = getWaveHeightAt(shipX, shipZ, elapsed);

          ferry.mesh.position.set(shipX, waveY + 0.08, shipZ);

          // 朝向前進切線並疊加微幅波浪俯仰角 (Pitch) 與橫搖角 (Roll)
          ferry.mesh.lookAt(shipX + tmpTan.x, waveY + 0.08, shipZ + tmpTan.z);
          ferry.mesh.rotation.x += Math.sin(elapsed * 3.5 + fIdx) * 0.045;
          ferry.mesh.rotation.z += Math.cos(elapsed * 2.8 + fIdx) * 0.05;
        });
      }

      // 6. 單一狀態機平滑運鏡 (Cubic Ease-Out)
      if (camFlight.active) {
        const u = Math.min(1, (elapsed - camFlight.startTime) / camFlight.duration);
        const ease = 1 - Math.pow(1 - u, 3);
        camera.position.lerpVectors(camFlight.startPos, camFlight.endPos, ease);
        controls.target.lerpVectors(camFlight.startTarget, camFlight.endTarget, ease);
        if (u >= 1) camFlight.active = false;
      } else if (isAutoOrbit) {
        const angle = elapsed * 0.18;
        camera.position.x = Math.sin(angle) * 76;
        camera.position.z = Math.cos(angle) * 76;
        camera.position.y = 48;
        controls.target.set(0, 0, 0);
      }

      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }

    /* =========================================================================
       8. UI 互動、3D 射線拾取與 Web Speech API 語音教學
       ========================================================================= */
    function flyCameraTo(endPos, endTarget, duration = 1.15) {
      isAutoOrbit = false;
      document.getElementById('btn-orbit-tour').classList.remove('active');
      camFlight.active = true;
      camFlight.startTime = clock.getElapsedTime();
      camFlight.duration = duration;
      camFlight.startPos.copy(camera.position);
      camFlight.endPos.copy(endPos);
      camFlight.startTarget.copy(controls.target);
      camFlight.endTarget.copy(endTarget);
    }

        b.onclick = () => {
          optContainer.querySelectorAll('.quiz-option').forEach(el => el.classList.remove('correct', 'wrong'));
          b.classList.add(opt.correct ? 'correct' : 'wrong');
          fb.textContent = opt.msg;
          fb.style.color = opt.correct ? '#6ee7b7' : '#fca5a5';
        };
        optContainer.appendChild(b);
      });

      window.toggleDrawer(true);
    }

    window.focusIsland = function(idx) {
      const data = ARCHIPELAGO_DATA[idx];
      updateDrawerUI(idx);
      flyCameraTo(
        new THREE.Vector3(data.camOffset.x, data.camOffset.y, data.camOffset.z),
        new THREE.Vector3(data.lookAt.x, data.lookAt.y, data.lookAt.z)
      );
    };

    window.toggleDrawer = function(show) {
      document.getElementById('writing-drawer').classList.toggle('collapsed', !show);
    };

    window.toggleQuizBox = function() {
      document.getElementById('quiz-box').classList.toggle('active');
    };

    window.cycleChartBlend = function() {
      chartBlendMode = (chartBlendMode + 1) % 3;
      const btn = document.getElementById('btn-wave-chart');
      if (chartBlendMode === 2) {
        oceanMesh.material.map = chartTexture;
        oceanMesh.material.opacity = 0.98;
        btn.textContent = '🗺️ 海圖波浪：高融合 (100%)';
        btn.classList.add('active');
      } else if (chartBlendMode === 1) {
        oceanMesh.material.map = chartTexture;
        oceanMesh.material.opacity = 0.68;
        btn.textContent = '🗺️ 海圖波浪：輕透融合 (65%)';
        btn.classList.add('active');
      } else {
        oceanMesh.material.map = plainOceanTexture;
        oceanMesh.material.opacity = 0.92;
        btn.textContent = '🌊 海圖波浪：純立體深海';
        btn.classList.remove('active');
      }
      oceanMesh.material.needsUpdate = true;
    };

    window.toggleFerryFleet = function() {
      isFerryVisible = !isFerryVisible;
      document.getElementById('btn-ferry-toggle').classList.toggle('active', isFerryVisible);
      bidirectionalFerries.forEach(f => { f.mesh.visible = isFerryVisible; });
    };

    window.toggleAutoOrbit = function() {
      isAutoOrbit = !isAutoOrbit;
      camFlight.active = false;
      document.getElementById('btn-orbit-tour').classList.toggle('active', isAutoOrbit);
    };

    window.setTopChartView = function() {
      flyCameraTo(new THREE.Vector3(0, 96, 0.1), new THREE.Vector3(0, 0, 0), 1.2);
    };

    window.resetOverview = function() {
      flyCameraTo(new THREE.Vector3(0, 56, 74), new THREE.Vector3(0, 0, 2), 1.1);
    };

    window.speakIslandGuidance = function() {
      if (!('speechSynthesis' in window)) {
        alert('您的瀏覽器暫不支援語音合成功能');
        return;
      }
      window.speechSynthesis.cancel();
      const data = ARCHIPELAGO_DATA[currentIslandIdx];
      const utter = new SpeechSynthesisUtterance(data.voiceText);
      utter.lang = 'zh-TW';
      utter.rate = 1.03;
      const lbl = document.getElementById('voice-btn-label');
      lbl.textContent = '星際導師朗讀中...';
      utter.onend = () => { lbl.textContent = '真人語音朗讀教學'; };
      utter.onerror = () => { lbl.textContent = '真人語音朗讀教學'; };
      window.speechSynthesis.speak(utter);
    };

    /* 3D 島嶼模型 Raycaster 點擊拾取 */
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    function onPointerUpRaycasting(e) {
      if (e.button !== 0) return;
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      const hits = raycaster.intersectObjects(clickableMeshes, false);
      if (hits.length > 0 && hits[0].object.userData.islandIdx !== undefined) {
        window.focusIsland(hits[0].object.userData.islandIdx);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    }

    initScene();
  </script>
</body>
</html>
